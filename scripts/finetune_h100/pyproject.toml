[project]
name = "lighton-hungarian-finetune"
version = "1.0.0"
description = "LightOnOCR-2 Hungarian fine-tuning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "peft>=0.7.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
train = "train:main"
